# Render Blueprint — RWA Credit Manager (Ethereum Sepolia testnet only).
# Schema: https://render.com/schema/render.yaml.json   Validate: `render blueprints validate`
#
# 1. Deploy the dashboard for free. Sepolia transactions require deploying contracts (docs/DEPLOYMENT.md),
#    running `npm run sync`, and committing the deployment and generated addresses.
# 2. Create this Blueprint. No keeper, wallet secret, or paid service is provisioned.
projects:
  - name: rwa-credit-manager
    environments:
      - name: testnet
        services:
          - type: web
            name: rwa-credit-manager-web
            runtime: node
            plan: free
            region: singapore
            buildCommand: npm ci && npm run build -w @rwa/web
            startCommand: npm run start -w @rwa/web
            healthCheckPath: /
            autoDeployTrigger: commit
            buildFilter:
              paths:
                - apps/web/**
                - packages/shared/**
                - package.json
                - package-lock.json
              ignoredPaths:
                - apps/web/e2e/**
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NEXT_PUBLIC_DEFAULT_CHAIN_ID
                value: "11155111"
              - key: NEXT_PUBLIC_ENABLE_LOCAL_CHAIN
                value: "false"
              - key: NEXT_PUBLIC_ENABLE_DEV_WALLET
                value: "false"
              - key: NEXT_PUBLIC_SEPOLIA_RPC_URL
                value: https://ethereum-sepolia-rpc.publicnode.com
